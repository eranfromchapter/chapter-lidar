# Root gates on every push: format, lint, typecheck, unit (TypeScript workspaces and
# Swift 6 Linux tests via scripts/swift-test.sh), then independent validation of the
# export files written by the PlanExport and MeshExport tests.
#
# No secrets are used. Third-party actions are pinned to full commit SHAs.
name: ci

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Uses the runner's Swift when it is on PATH; otherwise installs the pinned,
      # signature-checked toolchain and adds it to GITHUB_PATH for the next steps.
      - name: Set up Swift 6
        run: scripts/bootstrap-swift.sh

      - name: Check Swift is version 6
        run: |
          version="$(swift --version 2>&1)"
          echo "${version}"
          if ! grep -Eq 'Swift version 6\.' <<<"${version}"; then
            echo "::error::Swift 6 is required for the Linux tests."
            exit 1
          fi

      # Runs the workspace tests, then scripts/swift-test.sh.
      - name: Unit
        run: npm test

      # Export test output is written by the Swift tests above. A package whose
      # test-output folder exists must pass every check for its file kinds.
      - name: Verify export files
        run: |
          verify_folder() {
            local folder="$1"
            shift
            if [[ ! -d "${folder}" ]]; then
              echo "verify-exports: skipped: ${folder} not present yet"
              return 0
            fi
            local kind
            for kind in "$@"; do
              scripts/verify-exports.sh "${kind}" "${folder}"
            done
          }
          verify_folder ios/Packages/PlanExport/.build/test-output dxf pdf preview
          verify_folder ios/Packages/MeshExport/.build/test-output gltf las
