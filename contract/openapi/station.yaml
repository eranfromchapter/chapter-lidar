openapi: 3.1.0
info:
  title: Chapter Capture station API
  version: 1.1.0
  summary: Upload, registration and verdicts for Chapter Capture intake packages.
  description: |
    The station receives intake packages from the Chapter Capture app, registers them, runs the
    acceptance checks and serves the verdict. One package is one site visit (`visitId`); each
    floor or area scan in it is a separate capture with its own `captureId`.

    Flow for the app:

    1. Look up the HUB project (`GET /projects`) and confirm the address on site.
    2. Seal the package on the phone (works offline), then open an upload session
       (`POST /packages`) with the manifest's file list. The station answers with one upload
       target (a write-only Azure Blob SAS URL) per file that still needs uploading.
    3. Upload each file to its target, then report it with `POST /packages/{packageId}/files/complete`.
       The station computes the SHA-256 and size of the stored blob and returns the result.
    4. When every file is verified, send the manifest with `POST /packages/{packageId}/seal`. The
       package moves to `checks_queued`.
    5. Poll `GET /packages/{packageId}` until `verdict_ready`, then read
       `GET /packages/{packageId}/verdict`. After the checks the station makes the spatial
       report (`GET /packages/{packageId}/spatial-report`) and publishes the package to the HUB
       (`publication` on the package).
    6. While the operator prepares the next revision on the phone, the app may describe it with
       `PUT /packages/{packageId}/next-revision` (best effort; the review screen shows it).

    The review screen lists projects and packages with `GET /review/projects`,
    `GET /review/packages` and `GET /modeling-decisions`.

    Document bodies use the contract JSON Schemas in `contract/schema/` (manifest, capture
    record, field controls, verdict). Conventions: optional fields are omitted, never null;
    timestamps are UTC with whole seconds (`2026-10-17T14:02:11Z`); UUIDs and SHA-256 values are
    lowercase.

    1.1.0 is additive: new operations and new optional response properties. A client written
    for 1.0.0 keeps working.

    Every operation except `GET /health` needs a Microsoft Entra ID bearer token. Each operation
    lists the app roles it accepts in `x-roles`; a valid token without one of them gets 403.
  license:
    name: Proprietary, Hello Chapter LLC
    identifier: LicenseRef-HelloChapter-Proprietary
servers:
  - url: /v1
    description: Station API base path, relative to the station host of each environment.
security:
  - entra: []
tags:
  - name: health
    description: Liveness of the station service.
  - name: projects
    description: HUB project lookup for the capture app.
  - name: packages
    description: Upload sessions, file verification, sealing and package status.
  - name: verdicts
    description: Station verdict for a package.
  - name: modeling-decisions
    description: Log of the package source a BIM operator used for each modeling decision.
  - name: review
    description: Project and package lists for the review screen.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Check that the station is up
      description: Unauthenticated liveness check. Returns no package or project data.
      security: []
      x-roles: []
      responses:
        "200":
          description: The station is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The station is running but cannot serve requests (for example the registry is unreachable).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List HUB projects available for capture
      description: |
        HUB deals that have a confirmed property address in the HUB, so the app can show the
        address for on-site confirmation. Deals without a confirmed address are not returned.
      x-roles: [capture, bim, admin]
      parameters:
        - name: q
          in: query
          description: Text to match against the project name or address. Omit to list recent projects.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching projects, most recently updated first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/HubProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/HubUnavailable"

  /projects/{dealId}:
    parameters:
      - $ref: "#/components/parameters/DealId"
    get:
      tags: [projects]
      operationId: getProject
      summary: Get one HUB project
      x-roles: [capture, bim, admin]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/HubUnavailable"

  /packages:
    post:
      tags: [packages]
      operationId: createUploadSession
      summary: Open or resume the upload session of a package
      description: |
        Registers a package sealed on the phone and returns an upload target for every file that
        is not yet verified. `packageId` is generated by the app and is the manifest's
        `packageId`. The file list is the manifest's file list (the manifest itself is sent at
        sealing, not uploaded here).

        Idempotent: repeating the call with the same body returns the same session with fresh
        upload targets (200), which is how the app resumes after going offline or after the
        targets expire. A different body for an existing `packageId` is a conflict (409).

        Carry-over (new packages of revision 2 or later): when the station holds the package
        named by `supersedesPackageId`, it must be the same visit and deal, revision one lower,
        and no longer uploading; otherwise 422 with code `supersedes_mismatch` (pointer
        `/supersedesPackageId`). Each declared file whose path, role, capture, SHA-256 and size
        equal a verified file of that package is verified at once from the stored blob
        (`carriedOverFrom` is set and no upload target is granted). When the station does not
        hold that package (revision n never arrived), every file gets a target as usual. Opening
        the session removes the next-revision notice of the superseded package.
      x-roles: [capture, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionRequest"
      responses:
        "200":
          description: Existing session resumed; targets are reissued for files not yet verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "201":
          description: Session created.
          headers:
            Location:
              description: URL of the package.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    get:
      tags: [packages]
      operationId: listPackages
      summary: List the packages of a HUB project
      x-roles: [capture, bim, admin]
      parameters:
        - name: dealId
          in: query
          required: true
          description: HUB deal id.
          schema:
            $ref: "#/components/schemas/DealId"
        - name: visitId
          in: query
          required: false
          description: Only packages (all revisions) of this site visit.
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Packages of the project, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [packages]
                properties:
                  packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackageSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /packages/{packageId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [packages]
      operationId: getPackage
      summary: Get a package with its files and status
      x-roles: [capture, bim, admin]
      responses:
        "200":
          description: The package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /packages/{packageId}/files/complete:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags: [packages]
      operationId: completeFile
      summary: Report a file as uploaded and get its server-side check
      description: |
        The station reads the stored blob, computes its SHA-256 and size and compares them with
        the declared values. The result is returned with 200 whether or not it matches; on a
        mismatch the app uploads the file again to a fresh target from `POST /packages`.
        A verified blob is immutable.
      x-roles: [capture, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path:
                  $ref: "#/components/schemas/RelativePath"
      responses:
        "200":
          description: Check result for the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /packages/{packageId}/files/download:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [packages]
      operationId: getFileDownloadLink
      summary: Get a short-lived read-only download link for one verified file
      description: |
        Returns a read-only Azure Blob SAS URL for the stored original of one verified file of
        the package, valid for 10 minutes. Files that are not verified have no link (409 with
        code `file_not_verified`). Every link handed out is recorded in the audit log (who,
        which file, when); the URL itself is never recorded.

        Once the package is sealed, `path` may also be the sealed manifest
        (`Source Register/{visitId}/manifest.json`, `Package.manifestFile.path`); before the
        seal that path is 404. The audit entry records the role as `manifest`.
      x-roles: [bim, admin]
      parameters:
        - name: path
          in: query
          required: true
          description: The file's path in the manifest, or the sealed manifest's own path.
          schema:
            $ref: "#/components/schemas/RelativePath"
      responses:
        "200":
          description: Download link for the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The file has no verified upload yet (code `file_not_verified`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /packages/{packageId}/seal:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags: [packages]
      operationId: sealPackage
      summary: Register the manifest and queue the acceptance checks
      description: |
        Body is the package manifest exactly as written on the phone; the station stores it as
        `Source Register/{visitId}/manifest.json`. Accepted only when every file of the session
        is verified and the manifest lists exactly those files with the same role, capture,
        SHA-256 and size. On success the package status becomes `checks_queued`.

        Idempotent: sealing again with the same manifest returns the package unchanged (200).
      x-roles: [capture, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/manifest.schema.json"
      responses:
        "200":
          description: Already sealed with this manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "202":
          description: Sealed; acceptance checks are queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /packages/{packageId}/verdict:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [verdicts]
      operationId: getVerdict
      summary: Get the verdict of a package
      description: |
        The station verdict (ready, limited or blocked). 404 with code `verdict_not_ready` while
        the checks have not finished.
      x-roles: [capture, bim, admin]
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "../schema/verdict.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /packages/{packageId}/modeling-decisions:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [modeling-decisions]
      operationId: listModelingDecisions
      summary: List the modeling decisions logged against a package
      x-roles: [bim, admin]
      responses:
        "200":
          description: Decisions, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelingDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [modeling-decisions]
      operationId: createModelingDecision
      summary: Log the source used for a modeling decision
      description: |
        Records which package files (and, where relevant, which field control or capture model
        element) a BIM operator relied on for one modeling decision. Decisions are append-only;
        the signed-in user and time are recorded by the station.
      x-roles: [bim, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelingDecisionInput"
      responses:
        "201":
          description: Decision logged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelingDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /packages/{packageId}/next-revision:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    put:
      tags: [packages]
      operationId: putNextRevisionNotice
      summary: Describe the next revision the phone is preparing
      description: |
        Replaces the stored notice of the sealed package `packageId`: what the next revision
        (`revision` = the package's revision + 1) adds, changes or removes while the operator is
        still working on it on the phone. Best effort: the app sends it when online, debounced,
        and ignores failures. The station records who sent it (`updatedBy`) and when
        (`updatedAt`) and returns it as `Package.nextRevision`. The notice is removed when an
        upload session opens for a package that supersedes `packageId`.
      x-roles: [capture, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextRevisionNoticeInput"
      responses:
        "200":
          description: The stored notice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextRevisionNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The package is still uploading (code `package_not_sealed`), or a package that
            supersedes it already exists (code `revision_exists`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The notice's `revision` is not the package's revision + 1 (code `revision_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /packages/{packageId}/spatial-report:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [verdicts]
      operationId: getSpatialReportLink
      summary: Get a short-lived read-only link to the station's spatial report
      description: |
        The spatial report PDF of the package's current verdict, made by the station after its
        checks. Read-only SAS link valid for 10 minutes; every link handed out is audited (the URL
        never is). 404 with code `report_not_ready` while there is no report for the current
        verdict.
      x-roles: [bim, admin]
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpatialReportLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /packages/{packageId}/archive:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags: [packages]
      operationId: requestPackageArchive
      summary: Prepare a ZIP of the whole sealed package, or get its link when it is ready
      description: |
        A store-only ZIP of every verified package file at its manifest path, plus
        `manifest.json`, `verdict.json` and `spatial-report.pdf` when present, kept for 7 days.
        200 with a read-only link (path `{revision}.zip`, audited like file links) when the ZIP
        exists; otherwise the station queues it and answers 202 with its state.
      x-roles: [bim, admin]
      responses:
        "200":
          description: The ZIP is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadLink"
        "202":
          description: The ZIP is being prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The package is not sealed (code `package_not_sealed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [packages]
      operationId: getPackageArchive
      summary: Get the state of the package ZIP without preparing it
      description: |
        200 with the link when the ZIP is ready, 202 while it is being prepared, 404 with code
        `archive_not_requested` when nobody asked for it (or it expired).
      x-roles: [bim, admin]
      responses:
        "200":
          description: The ZIP is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadLink"
        "202":
          description: The ZIP is being prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /review/projects:
    get:
      tags: [review]
      operationId: listReviewProjects
      summary: List the projects that have packages
      description: |
        Projects with at least one package, most recent package change first, each with its
        newest package. Name and address come from the HUB project cache (also when expired),
        else from the newest sealed capture record, else `HUB deal {dealId}`. `q` matches,
        case-insensitively, part of the project name or address, the start of the deal id, or
        the start (8 hex characters or more) of a capture or package id.
      x-roles: [capture, bim, admin]
      parameters:
        - name: q
          in: query
          required: false
          description: Text to match (project name, address, deal id, capture or package id).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [projects, truncated]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewProject"
                  truncated:
                    description: True when more projects match than `limit`.
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /review/packages:
    get:
      tags: [review]
      operationId: listReviewPackages
      summary: List packages across projects, newest first
      description: Every package the station knows, newest first, with its project's name and address. `q` matches as for `GET /review/projects`.
      x-roles: [capture, bim, admin]
      parameters:
        - name: q
          in: query
          required: false
          description: Text to match (project name, address, deal id, capture or package id).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: The packages.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [packages, truncated]
                properties:
                  packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewPackage"
                  truncated:
                    description: True when more packages match than `limit`.
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /modeling-decisions:
    get:
      tags: [modeling-decisions]
      operationId: listAllModelingDecisions
      summary: List modeling decisions across packages, newest first
      x-roles: [bim, admin]
      parameters:
        - name: dealId
          in: query
          required: false
          description: Only decisions on packages of this HUB deal.
          schema:
            $ref: "#/components/schemas/DealId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: The decisions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [decisions, truncated]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelingDecisionWithContext"
                  truncated:
                    description: True when more decisions match than `limit`.
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    entra:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Microsoft Entra ID access token for the station API ("Chapter Main" tenant). The token's
        `roles` claim carries the station app roles: `capture` (field operators using the app),
        `bim` (BIM operators using the review screen) and `admin`.

  parameters:
    PackageId:
      name: packageId
      in: path
      required: true
      description: Package id (the manifest's `packageId`).
      schema:
        $ref: "#/components/schemas/Uuid"
    DealId:
      name: dealId
      in: path
      required: true
      description: HUB deal id.
      schema:
        $ref: "#/components/schemas/DealId"

  responses:
    BadRequest:
      description: The request is malformed (not JSON, wrong types, unknown parameters).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, expired or invalid Entra ID token.
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The token is valid but has none of the roles listed in the operation's x-roles.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The project, package, file or verdict does not exist (yet).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        The request conflicts with the package's state, for example a different body for an
        existing packageId, a file reported after sealing, or sealing before every file is verified.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The body is well-formed JSON but breaks a contract rule (schema or cross-field rule).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    HubUnavailable:
      description: The HUB did not answer or returned an error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Uuid:
      $ref: "../schema/manifest.schema.json#/$defs/uuid"
    DateTime:
      $ref: "../schema/manifest.schema.json#/$defs/dateTime"
    AreaKey:
      $ref: "../schema/manifest.schema.json#/$defs/areaKey"
    RelativePath:
      $ref: "../schema/manifest.schema.json#/$defs/relativePath"
    FileRole:
      $ref: "../schema/manifest.schema.json#/$defs/role"
    Sha256:
      description: Lowercase hex SHA-256.
      type: string
      pattern: "^[0-9a-f]{64}$"
    DealId:
      description: HUB deal id, as returned by the HUB.
      type: string
      minLength: 1
      maxLength: 64

    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          description: Station build version.
          type: string
          minLength: 1
          maxLength: 50

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: URI reference identifying the problem type.
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: Plain-language explanation for this occurrence.
          type: string
        code:
          description: Stable machine-readable code, for example verdict_not_ready or sha256_mismatch.
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        errors:
          description: Individual rule violations, for 400 and 422.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pointer, message]
            properties:
              pointer:
                description: JSON Pointer to the offending value in the request body.
                type: string
              message:
                type: string

    HubProject:
      description: A HUB deal with its confirmed property address.
      type: object
      additionalProperties: false
      required: [dealId, address]
      properties:
        dealId:
          $ref: "#/components/schemas/DealId"
        projectName:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: object
          additionalProperties: false
          required: [formatted]
          properties:
            formatted:
              description: Single-line address exactly as shown by the HUB. The app copies it into capture-record address.formatted.
              type: string
              minLength: 1
              maxLength: 300
        projectManager:
          description: The deal's project manager, when the HUB provides one. Omitted otherwise.
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            phone:
              description: Phone number as the HUB gives it, for a call from the app.
              type: string
              minLength: 1
              maxLength: 50

    UploadFileDeclaration:
      description: One manifest file entry, as declared before upload.
      type: object
      additionalProperties: false
      required: [path, role, sha256, bytes]
      properties:
        path:
          $ref: "#/components/schemas/RelativePath"
        role:
          $ref: "#/components/schemas/FileRole"
        captureId:
          description: Required for every role except capture_record and field_controls, which must omit it.
          $ref: "#/components/schemas/Uuid"
        areaKey:
          description: Present exactly when captureId is.
          $ref: "#/components/schemas/AreaKey"
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          format: int64
          minimum: 0

    UploadSessionRequest:
      type: object
      additionalProperties: false
      required: [packageId, visitId, dealId, revision, files]
      properties:
        packageId:
          $ref: "#/components/schemas/Uuid"
        visitId:
          $ref: "#/components/schemas/Uuid"
        dealId:
          $ref: "#/components/schemas/DealId"
        revision:
          type: integer
          minimum: 1
        supersedesPackageId:
          description: packageId of the previous revision. Required when revision is greater than 1, omitted otherwise.
          $ref: "#/components/schemas/Uuid"
        files:
          description: Every file of the manifest; paths are unique.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/UploadFileDeclaration"

    PackageStatus:
      description: |
        uploading: session open, not every file verified or not sealed yet.
        checks_queued: sealed, acceptance checks waiting to run.
        checking: acceptance checks running.
        verdict_ready: the verdict is available.
        check_error: the station could not complete the checks (not a verdict); the station retries or an admin intervenes.
      enum: [uploading, checks_queued, checking, verdict_ready, check_error]

    FileStatus:
      description: |
        pending: no verified upload yet.
        verified: stored blob matches the declared SHA-256 and size.
        sha256_mismatch / bytes_mismatch: stored blob differs; upload again.
        not_uploaded: no blob found at the target.
      enum: [pending, verified, sha256_mismatch, bytes_mismatch, not_uploaded]

    UploadTarget:
      description: |
        Write-only Azure Blob SAS URL for one file. Upload with Put Blob for small files or
        Put Block + Put Block List (resumable) for large ones, sending the listed headers.
      type: object
      additionalProperties: false
      required: [url, method, headers, expiresAt]
      properties:
        url:
          type: string
          format: uri
        method:
          const: PUT
        headers:
          description: Headers to send with the upload, for example x-ms-blob-type BlockBlob.
          type: object
          additionalProperties:
            type: string
        expiresAt:
          $ref: "#/components/schemas/DateTime"

    UploadSessionFile:
      type: object
      additionalProperties: false
      required: [path, status]
      properties:
        path:
          $ref: "#/components/schemas/RelativePath"
        status:
          $ref: "#/components/schemas/FileStatus"
        upload:
          description: Present for every file that is not verified.
          $ref: "#/components/schemas/UploadTarget"
        carriedOverFrom:
          description: Present when the file is verified because revision N-1 (`supersedesPackageId`) holds the same verified file; no upload target is granted.
          $ref: "#/components/schemas/Uuid"

    UploadSession:
      type: object
      additionalProperties: false
      required: [packageId, visitId, dealId, revision, status, files]
      properties:
        packageId:
          $ref: "#/components/schemas/Uuid"
        visitId:
          $ref: "#/components/schemas/Uuid"
        dealId:
          $ref: "#/components/schemas/DealId"
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/PackageStatus"
        createdAt:
          description: When the station registered the package (the session was first opened). The app shows it as "Registered".
          $ref: "#/components/schemas/DateTime"
        files:
          type: array
          items:
            $ref: "#/components/schemas/UploadSessionFile"

    FileCheckResult:
      description: Server-side check of one uploaded file.
      type: object
      additionalProperties: false
      required: [path, status, expectedSha256, expectedBytes, checkedAt]
      properties:
        path:
          $ref: "#/components/schemas/RelativePath"
        status:
          $ref: "#/components/schemas/FileStatus"
        expectedSha256:
          $ref: "#/components/schemas/Sha256"
        actualSha256:
          description: SHA-256 of the stored blob. Omitted when status is not_uploaded.
          $ref: "#/components/schemas/Sha256"
        expectedBytes:
          type: integer
          format: int64
          minimum: 0
        actualBytes:
          description: Size of the stored blob. Omitted when status is not_uploaded.
          type: integer
          format: int64
          minimum: 0
        checkedAt:
          $ref: "#/components/schemas/DateTime"

    PackageFile:
      type: object
      additionalProperties: false
      required: [path, role, sha256, bytes, status]
      properties:
        path:
          $ref: "#/components/schemas/RelativePath"
        role:
          $ref: "#/components/schemas/FileRole"
        captureId:
          $ref: "#/components/schemas/Uuid"
        areaKey:
          $ref: "#/components/schemas/AreaKey"
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/FileStatus"
        checkedAt:
          description: Time of the last server-side check. Omitted while pending.
          $ref: "#/components/schemas/DateTime"
        generator:
          description: The manifest entry's generator, for example chapter-capture-ios/PlanExport. Present once sealed.
          type: string
          minLength: 1
          maxLength: 100
        generatorVersion:
          description: The manifest entry's generatorVersion. Present once sealed.
          type: string
          minLength: 1
          maxLength: 50
        carriedOverFrom:
          description: Present when the file was verified by carry-over from that package (revision N-1).
          $ref: "#/components/schemas/Uuid"
        hub:
          description: Where the file is in the HUB after the last successful publication. Omitted before.
          $ref: "#/components/schemas/HubFileState"

    HubFileState:
      description: How a file appears in the HUB.
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          description: uploaded to the HUB folder, or linked (a station link listed instead).
          enum: [uploaded, linked]
        reason:
          description: Present when state is linked. too_large means over the HUB upload cap; not_published means the role is not uploaded to the HUB.
          enum: [too_large, not_published]

    DownloadLink:
      description: |
        Read-only link to the stored original of one verified file. The URL carries a signature:
        treat it as a secret until it expires (do not log or share it).
      type: object
      additionalProperties: false
      required: [path, sha256, bytes, url, expiresAt]
      properties:
        path:
          $ref: "#/components/schemas/RelativePath"
        sha256:
          description: Verified SHA-256 of the file, to check the download against.
          $ref: "#/components/schemas/Sha256"
        bytes:
          description: Verified size of the file.
          type: integer
          format: int64
          minimum: 0
        url:
          description: Azure Blob URL with a read-only SAS for this one file.
          type: string
          format: uri
        expiresAt:
          description: When the link stops working (10 minutes after it was issued).
          $ref: "#/components/schemas/DateTime"

    VerdictSummary:
      type: object
      additionalProperties: false
      required: [verdictId, outcome, evaluatedAt]
      properties:
        verdictId:
          $ref: "#/components/schemas/Uuid"
        outcome:
          $ref: "../schema/verdict.schema.json#/$defs/outcome"
        evaluatedAt:
          $ref: "#/components/schemas/DateTime"

    PackageSummaryFields:
      description: |
        The fields of a package summary, shared by PackageSummary, Package and ReviewPackage.
        Open on its own; each of those closes it (unevaluatedProperties false). Of the
        properties added in 1.1.0, `updatedAt`, `captures` and `totals` are in every response
        of a 1.1.0 station; the others are optional.
      type: object
      required:
        [packageId, visitId, dealId, revision, status, createdAt, updatedAt, captures, totals]
      properties:
        packageId:
          $ref: "#/components/schemas/Uuid"
        visitId:
          $ref: "#/components/schemas/Uuid"
        dealId:
          $ref: "#/components/schemas/DealId"
        revision:
          type: integer
          minimum: 1
        supersedesPackageId:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/PackageStatus"
        createdAt:
          description: When the upload session was opened, which is when the station registered the package. Shown as "Registered" on the phone and the web.
          $ref: "#/components/schemas/DateTime"
        sealedAt:
          description: The manifest's sealedAt. Present once the package is sealed at the station.
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          description: Last change of the package (status, files, verdict, publication, report).
          $ref: "#/components/schemas/DateTime"
        createdBy:
          description: Who opened the upload session. Omitted when the name is unknown.
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
        visitedAt:
          description: The capture record's visitedAt. Present once sealed.
          $ref: "#/components/schemas/DateTime"
        operatorName:
          description: The capture record's operator.name. Present once sealed.
          type: string
          minLength: 1
          maxLength: 200
        captures:
          description: The package's captures, in capture-record order once sealed, else in order of first appearance in path order. May be empty.
          type: array
          items:
            $ref: "#/components/schemas/PackageCapture"
        totals:
          $ref: "#/components/schemas/PackageTotals"
        checks:
          $ref: "#/components/schemas/CheckRunSummary"
        publication:
          $ref: "#/components/schemas/PublicationSummary"
        report:
          $ref: "#/components/schemas/ReportSummary"
        links:
          $ref: "#/components/schemas/PackageLinks"
        verdict:
          description: Present when status is verdict_ready.
          $ref: "#/components/schemas/VerdictSummary"

    PackageSummary:
      description: A package without its files.
      allOf:
        - $ref: "#/components/schemas/PackageSummaryFields"
      unevaluatedProperties: false

    Package:
      description: A package with its files. Manifest and capture record are present once sealed.
      allOf:
        - $ref: "#/components/schemas/PackageSummaryFields"
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/PackageFile"
        manifest:
          description: The registered manifest. Present once sealed.
          $ref: "../schema/manifest.schema.json"
        manifestFile:
          $ref: "#/components/schemas/ManifestFile"
        captureRecord:
          description: The package's capture record file. Present once sealed.
          $ref: "../schema/capture-record.schema.json"
        fieldControls:
          description: The package's field-controls file, parsed at sealing. Present once sealed when the package has one.
          $ref: "../schema/field-controls.schema.json"
        nextRevision:
          $ref: "#/components/schemas/NextRevisionNotice"
      unevaluatedProperties: false

    PackageCapture:
      description: One capture of a package.
      type: object
      additionalProperties: false
      required: [captureId, areaKey]
      properties:
        captureId:
          $ref: "#/components/schemas/Uuid"
        areaKey:
          $ref: "#/components/schemas/AreaKey"
        label:
          description: From the capture record, once sealed.
          type: string
          minLength: 1
          maxLength: 100
        mode:
          description: From the capture record, once sealed.
          enum: [room, floor, exterior]

    PackageTotals:
      description: File counts and sizes of the package, all declared files and the verified ones.
      type: object
      additionalProperties: false
      required: [files, bytes, filesVerified, bytesVerified]
      properties:
        files:
          type: integer
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
        filesVerified:
          type: integer
          minimum: 0
        bytesVerified:
          type: integer
          format: int64
          minimum: 0

    CheckRunSummary:
      description: The latest check run of the package. Omitted before the seal.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          description: queued (sealed, no run yet), running, completed or failed (the station could not finish the checks).
          enum: [queued, running, completed, failed]
        startedAt:
          $ref: "#/components/schemas/DateTime"
        finishedAt:
          description: Present when completed or failed.
          $ref: "#/components/schemas/DateTime"
        rules:
          description: Rules run. Present when completed.
          type: integer
          minimum: 0

    PublicationSummary:
      description: HUB publication of this revision. Omitted when nothing was queued.
      type: object
      additionalProperties: false
      required: [status, hubFolder]
      properties:
        status:
          enum: [pending, publishing, published, publish_failed]
        publishedAt:
          description: Present exactly when published.
          $ref: "#/components/schemas/DateTime"
        hubFolder:
          description: The revision's HUB folder, Capture/{visitId}/r{revision}.
          type: string
          minLength: 1
          maxLength: 200

    ReportSummary:
      description: |
        The station's spatial report of the current verdict. ready: a report of the current
        verdict exists; failed: the current verdict's publication failed and there is no such
        report; pending: otherwise. Omitted before a verdict.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          enum: [pending, ready, failed]
        generatedAt:
          description: Present when ready (the verdict's evaluatedAt).
          $ref: "#/components/schemas/DateTime"
        pages:
          description: Present when ready.
          type: integer
          minimum: 1
        bytes:
          description: Present when ready.
          type: integer
          format: int64
          minimum: 1
        sha256:
          description: Present when ready.
          $ref: "#/components/schemas/Sha256"
        checksPage:
          description: Page of the report that holds the capture checks. Present when ready.
          type: integer
          minimum: 1
        floors:
          description: Per capture with a readable model, in capture-record order. Present when ready.
          type: array
          items:
            $ref: "#/components/schemas/ReportFloor"
        hub:
          description: The report's file in the HUB (publication entry with role spatial_report). Omitted before it is published.
          $ref: "#/components/schemas/HubFileState"

    ReportFloor:
      description: Totals the spatial report computed for one floor or area.
      type: object
      additionalProperties: false
      required: [captureId, areaKey, roomsScanned, roomsUnlabeled, floorAreaSqFt]
      properties:
        captureId:
          $ref: "#/components/schemas/Uuid"
        areaKey:
          $ref: "#/components/schemas/AreaKey"
        roomsScanned:
          type: integer
          minimum: 0
        roomsUnlabeled:
          type: integer
          minimum: 0
        floorAreaSqFt:
          description: Sum of the rooms' floor areas, square feet, rounded to 0.1 once.
          type: number
          minimum: 0

    PackageLinks:
      description: Web pages of the package.
      type: object
      additionalProperties: false
      required: [review]
      properties:
        review:
          description: The package page of the review screen.
          type: string
          format: uri
        hub:
          description: The HUB page of the deal. Omitted when the station has no HUB deal URL configured.
          type: string
          format: uri

    ManifestFile:
      description: The sealed manifest file. Present once sealed.
      type: object
      additionalProperties: false
      required: [path, sha256, bytes]
      properties:
        path:
          description: Source Register/{visitId}/manifest.json.
          $ref: "#/components/schemas/RelativePath"
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          format: int64
          minimum: 0
        hub:
          $ref: "#/components/schemas/HubFileState"

    NextRevisionChange:
      description: One row of what the next revision adds, changes or removes, worded as the phone shows it.
      type: object
      additionalProperties: false
      required: [kind, subject, title, detail]
      properties:
        kind:
          enum: [added, changed, removed]
        subject:
          enum: [capture, room_names, field_control, photos, retired_file]
        title:
          type: string
          minLength: 1
          maxLength: 200
        detail:
          type: string
          minLength: 1
          maxLength: 300
        answersNextAction:
          description: A next action of the base verdict, verbatim, that this change answers.
          type: string
          minLength: 1
          maxLength: 500
        method:
          description: Instrument of a field-control change.
          enum: [tape, laser]

    NextRevisionNoticeInput:
      description: What the phone sends; the station adds updatedBy.
      type: object
      additionalProperties: false
      required: [revision, updatedAt, changes]
      properties:
        revision:
          description: The revision being prepared, the package's revision + 1.
          type: integer
          minimum: 2
        updatedAt:
          description: When the phone last changed the revision.
          $ref: "#/components/schemas/DateTime"
        changes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/NextRevisionChange"

    NextRevisionNotice:
      description: The next revision as the phone last described it. Present on a sealed package while its next revision is in progress on the phone.
      type: object
      additionalProperties: false
      required: [revision, updatedAt, changes]
      properties:
        revision:
          type: integer
          minimum: 2
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          description: Name of the signed-in user who sent the notice (set by the station).
          type: string
          minLength: 1
          maxLength: 200
        changes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/NextRevisionChange"

    SpatialReportLink:
      description: |
        Read-only link to the station's spatial report of the current verdict. The URL carries a
        signature: treat it as a secret until it expires.
      type: object
      additionalProperties: false
      required: [verdictId, name, sha256, bytes, pages, checksPage, generatedAt, url, expiresAt]
      properties:
        verdictId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          pattern: "^spatial-report-[0-9a-f-]{36}\\.pdf$"
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          format: int64
          minimum: 1
        pages:
          type: integer
          minimum: 1
        checksPage:
          description: Page of the report that holds the capture checks.
          type: integer
          minimum: 1
        generatedAt:
          $ref: "#/components/schemas/DateTime"
        url:
          type: string
          format: uri
        expiresAt:
          description: When the link stops working (10 minutes after it was issued).
          $ref: "#/components/schemas/DateTime"

    ArchiveState:
      description: The package ZIP is being prepared.
      type: object
      additionalProperties: false
      required: [status, startedAt]
      properties:
        status:
          const: preparing
        startedAt:
          $ref: "#/components/schemas/DateTime"

    ReviewProject:
      description: A HUB project that has packages, with its newest package.
      type: object
      additionalProperties: false
      required: [dealId, address, packageCount, latest]
      properties:
        dealId:
          $ref: "#/components/schemas/DealId"
        projectName:
          type: string
          minLength: 1
          maxLength: 200
        address:
          $ref: "#/components/schemas/HubProject/properties/address"
        packageCount:
          type: integer
          minimum: 1
        latest:
          $ref: "#/components/schemas/PackageSummary"

    ReviewPackage:
      description: A package summary with its project's name and address.
      allOf:
        - $ref: "#/components/schemas/PackageSummaryFields"
      required: [address]
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 200
        address:
          $ref: "#/components/schemas/HubProject/properties/address"
      unevaluatedProperties: false

    DecisionSource:
      description: One package file a decision relied on, optionally narrowed to one control or element in it.
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/RelativePath"
        controlId:
          description: Id of a field control, when path is the field-controls file.
          type: string
          minLength: 1
          maxLength: 128
        elementId:
          description: Id of a room, wall, door, window, opening or object, when path is a capture model.
          type: string
          minLength: 1
          maxLength: 128

    ModelingDecisionInput:
      type: object
      additionalProperties: false
      required: [element, decision, sources]
      properties:
        element:
          description: What was modeled, for example Floor 1 kitchen north wall.
          type: string
          minLength: 1
          maxLength: 300
        decision:
          description: What was decided, for example Wall length taken from tape distance A.
          type: string
          minLength: 1
          maxLength: 2000
        captureId:
          description: Capture the decision concerns, when it concerns one capture.
          $ref: "#/components/schemas/Uuid"
        areaKey:
          description: Present exactly when captureId is.
          $ref: "#/components/schemas/AreaKey"
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DecisionSource"
        note:
          type: string
          minLength: 1
          maxLength: 2000

    ModelingDecision:
      description: A logged decision. The fields of ModelingDecisionInput plus what the station records.
      type: object
      additionalProperties: false
      required: [decisionId, packageId, element, decision, sources, decidedBy, decidedAt]
      properties:
        decisionId:
          $ref: "#/components/schemas/Uuid"
        packageId:
          $ref: "#/components/schemas/Uuid"
        element:
          $ref: "#/components/schemas/ModelingDecisionInput/properties/element"
        decision:
          $ref: "#/components/schemas/ModelingDecisionInput/properties/decision"
        captureId:
          $ref: "#/components/schemas/ModelingDecisionInput/properties/captureId"
        areaKey:
