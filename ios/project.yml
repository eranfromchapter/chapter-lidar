# XcodeGen spec of the Chapter Capture app (spec F6, step F6.4).
#   xcodegen generate --spec ios/project.yml   ->  ios/ChapterCapture.xcodeproj (not committed)
# Contract with .github/workflows/ios.yml (job App) and testflight.yml: exactly one
# ios/*.xcodeproj, scheme `App` (build = the app, test = the UI tests on the simulator),
# CFBundleVersion from CURRENT_PROJECT_VERSION, CFBundleShortVersionString from MARKETING_VERSION.
# Scheme `ChapterUISnapshots` (ios.yml, job ChapterUI) runs ChapterUI's app-hosted snapshot tests.
# No team id is committed: testflight.yml passes DEVELOPMENT_TEAM.
name: ChapterCapture

options:
  bundleIdPrefix: com.hellochapter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic

packages:
  CaptureContract:
    path: ../contract/swift
  ChapterUI:
    path: Packages/ChapterUI
  CaptureCore:
    path: Packages/CaptureCore
  PlanExport:
    path: Packages/PlanExport
  MeshExport:
    path: Packages/MeshExport
  FieldKit:
    path: Packages/FieldKit
  PackageKit:
    path: Packages/PackageKit
  StationClient:
    path: Packages/StationClient
  SketchCapture:
    path: Packages/SketchCapture
  AppCore:
    path: App/AppCore
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    exactVersion: 2.16.0

targets:
  App:
    type: application
    platform: iOS
    configFiles:
      Debug: App/Config/Debug.xcconfig
      Release: App/Config/Release.xcconfig
    sources:
      - path: App/Sources
        excludes: [".apple-only"]
      # UI-test fixture (box-room capture and photo). Debug only: excluded from Release below.
      - path: ../fixtures/generated/box-room/package
        type: folder
        buildPhase: resources
      # The sketch reader's prompt and schema (spec F16), for the field-test build's direct
      # Claude call. Debug only: excluded from Release below.
      - path: ../contract/prompts/sketch-interpretation.md
        buildPhase: resources
      - path: ../contract/schema/sketch-interpretation.schema.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ChapterCapture
        PRODUCT_BUNDLE_IDENTIFIER: com.hellochapter.capture
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/App.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
      configs:
        Release:
          # The UI-test and field-test stubs and the fixture never ship: `UITest*` and `FieldTest*`
          # sources (also #if DEBUG), the fixture folder and the sketch reader's prompt and schema
          # (only the field test reads them) are not built into Release.
          EXCLUDED_SOURCE_FILE_NAMES: "UITest* FieldTest* package sketch-interpretation.md sketch-interpretation.schema.json"
    dependencies:
      - package: AppCore
        product: AppCore
      - package: CaptureContract
        product: CaptureContract
      # Screen tokens v2, fonts (Inter, registered at launch), logo and shared components.
      - package: ChapterUI
        product: ChapterUI
      - package: CaptureCore
        product: CaptureCore
      - package: CaptureCore
        product: CaptureModelMapping
      - package: CaptureCore
        product: CaptureRoomPlan
      - package: CaptureCore
        product: CaptureUI
      - package: PlanExport
        product: PlanExport
      - package: MeshExport
        product: MeshExport
      - package: FieldKit
        product: FieldKit
      - package: PackageKit
        product: PackageKit
      - package: StationClient
        product: StationClient
      - package: SketchCapture
        product: SketchSolver
      - package: SketchCapture
        product: SketchMesh
      - package: SketchCapture
        product: SketchEntry
      - package: SketchCapture
        product: SketchUI
      - package: SketchCapture
        product: Walkthrough
      - package: SketchCapture
        product: SketchReading
      - package: SketchCapture
        product: WalkthroughUI
      - package: MSAL
        product: MSAL

  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
        excludes: [".apple-only"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellochapter.capture.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: App
    dependencies:
      - target: App

  # ChapterUI's app-hosted snapshot tests (critique R-18d): the boards with system chrome drawn
  # with drawHierarchy, which needs a UIApplication (Swift package tests have none). The host is
  # an empty app; the boards are shared with the package's tests.
  ChapterUISnapshotHost:
    type: application
    platform: iOS
    sources:
      - path: Packages/ChapterUI/SnapshotHost
    settings:
      base:
        PRODUCT_NAME: ChapterUISnapshotHost
        PRODUCT_BUNDLE_IDENTIFIER: com.hellochapter.chapterui.snapshothost
        GENERATE_INFOPLIST_FILE: YES
        # A full-screen scene (no letterboxing), as the app has.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: NO

  ChapterUIHostedSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/ChapterUI/HostedTests
        excludes: ["__Snapshots__"]
      - path: Packages/ChapterUI/Tests/ChapterUITests/SnapshotBoards.swift
      - path: Packages/ChapterUI/Tests/ChapterUITests/PixelProbe.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellochapter.chapterui.hostedsnapshottests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      # The test host (XcodeGen sets TEST_HOST from it).
      - target: ChapterUISnapshotHost
      - package: ChapterUI
        product: ChapterUI
      - package: ChapterUI
        product: ChapterUISnapshotTesting

  # The package screens' snapshot tests (phone-package §13.4, critique R-18d): the app's
  # PackageScreens.swift compiled with its tests (it uses AppCore and ChapterUI only), hosted by
  # ChapterUI's empty host app like the boards above; run by scheme ChapterUISnapshots.
  PackageScreensSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/PackageScreensTests
        excludes: ["__Snapshots__"]
      - path: App/Sources/App/Views/PackageScreens.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellochapter.capture.packagescreenstests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: ChapterUISnapshotHost
      - package: AppCore
        product: AppCore
      - package: CaptureContract
        product: CaptureContract
      - package: PackageKit
        product: PackageKit
      - package: ChapterUI
        product: ChapterUI
      - package: ChapterUI
        product: ChapterUISnapshotTesting

schemes:
  App:
    build:
      targets:
        App: all
        AppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AppUITests
    archive:
      config: Release

  ChapterUISnapshots:
    build:
      targets:
        ChapterUISnapshotHost: [test]
        ChapterUIHostedSnapshotTests: [test]
        PackageScreensSnapshotTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ChapterUIHostedSnapshotTests
        - PackageScreensSnapshotTests
